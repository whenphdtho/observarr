name: ci
on:
  push:
    branches: ['**']   # tags are checked by release.yml, which calls this workflow
  pull_request:
  workflow_call:
    inputs:
      skip-image:
        description: Skip the container image build (the caller builds it itself)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: go.mod/go.sum are tidy
        run: go mod tidy -diff
      - name: Build web app
        run: make ui
      - name: gofmt, vet, tests (race detector)
        run: make check
      - name: Known vulnerabilities in dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Container image builds
        if: ${{ !inputs.skip-image }}
        run: docker build -t observarr:ci .
