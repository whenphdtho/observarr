name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: go.mod/go.sum are tidy
        run: go mod tidy -diff
      - name: Build web app
        run: make ui
      - name: gofmt, vet, tests (race detector)
        run: make check
      - name: Known vulnerabilities in dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Container image builds
        run: docker build -t observarr:ci .
