name: release
# A pushed vX.Y.Z tag (or vX.Y.Z-rc.N) runs the checks, publishes a signed multi-arch image to GHCR, builds
# static binaries and creates the GitHub release. Run it by hand (workflow_dispatch) for a dry build that
# pushes and publishes nothing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions: {}
env:
  IMAGE: ghcr.io/whenphdtho/observarr
jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip-image: true

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signature
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z always; X.Y and X are skipped for a prerelease (vX.Y.Z-rc.N) by metadata-action itself,
          # and latest is set only when the tag has no prerelease part.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.description=A self-hosted ops cockpit for your *arr and media stack.
      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ env.PUSH == 'true' }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign the image
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  binaries:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        run: make ui
      - name: Build static binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" -o "dist/observarr-${os}-${arch}" ./cmd/observarr
          done
          cd dist && sha256sum observarr-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          cat > notes.md <<EOF
          ## Container image

          \`\`\`
          ${IMAGE}:${VERSION}
          ${IMAGE}@${DIGEST}
          \`\`\`

          Multi-arch (linux/amd64, linux/arm64), with SBOM and provenance attestations. Verify the signature:

          \`\`\`sh
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/whenphdtho/observarr/.github/workflows/release.yml@refs/tags/v.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Static binaries (UI embedded) are attached; check them against \`SHA256SUMS\`.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file notes.md --generate-notes "${prerelease[@]}"
